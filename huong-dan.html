<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hướng Dẫn Dịch Vụ Công - Đông Mai Số</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }

        .hover-lift {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-fade-in-up {
            animation: fadeInUp 0.5s ease-out forwards;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
    <!-- Header -->
    <header
        class="fixed top-0 left-0 right-0 z-50 transition-all duration-300 bg-white/80 backdrop-blur-md shadow-sm border-b border-gray-100">
        <div class="container mx-auto px-4 h-20 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 group">
                <div
                    class="w-14 h-14 bg-white rounded-xl flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform border border-gray-100">
                    <img src="logo.png" alt="Logo" class="w-12 h-12 object-contain">
                </div>
                <div>
                    <h1
                        class="font-bold text-2xl text-gray-900 leading-none group-hover:text-red-600 transition-colors">
                        ĐÔNG MAI SỐ</h1>
                    <p class="text-xs font-medium text-gray-500 tracking-wider uppercase">Hành chính phục vụ</p>
                </div>
            </a>
            <a href="index.html"
                class="flex items-center gap-2 text-gray-600 hover:text-red-600 font-medium transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                Quay lại trang chủ
            </a>
        </div>
    </header>

    <main class="pt-28 pb-20 px-4 flex-1">
        <div class="container mx-auto max-w-6xl">
            <!-- Page Title -->
            <div class="text-center mb-8">
                <h1 class="text-3xl md:text-5xl font-bold mb-4 text-gray-900">Hướng Dẫn Dịch Vụ Công</h1>
                <p class="text-gray-500 text-lg">Hướng dẫn chi tiết các thủ tục hành chính công tại phường Đông Mai</p>
            </div>

            <!-- Search Bar -->
            <div class="mb-8 max-w-2xl mx-auto">
                <div class="relative">
                    <input type="text" id="searchInput" placeholder="Tìm kiếm hướng dẫn..."
                        class="w-full px-4 py-3 pl-12 rounded-xl border border-gray-200 focus:border-red-500 focus:ring-2 focus:ring-red-200 outline-none transition-all">
                    <i data-lucide="search" class="w-5 h-5 text-gray-400 absolute left-4 top-1/2 -translate-y-1/2"></i>
                </div>
            </div>

            <!-- Loading -->
            <div id="loading" class="text-center py-20">
                <i data-lucide="loader" class="w-10 h-10 text-red-600 animate-spin mx-auto mb-4"></i>
                <p class="text-gray-500">Đang tải hướng dẫn...</p>
            </div>

            <!-- News Grid (2 columns, centered) -->
            <div id="news-grid" class="grid grid-cols-2 gap-6 max-w-5xl mx-auto hidden">
                <!-- Guide items injected here -->
            </div>

            <!-- Pagination -->
            <div id="pagination" class="hidden mt-12 flex justify-center items-center gap-2">
                <!-- Pagination buttons injected here -->
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="hidden text-center py-20">
                <i data-lucide="book-open" class="w-16 h-16 text-gray-300 mx-auto mb-4"></i>
                <p class="text-gray-500 text-lg">Chưa có hướng dẫn nào được đăng tải.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 UBND Phường Đông Mai. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        lucide.createIcons();

        // Initialize Supabase
        window.supabase = window.supabaseClient || supabase.createClient(
            window.SUPABASE_CONFIG.url,
            window.SUPABASE_CONFIG.key
        );

        // Helper to extract plain text from HTML content
        function extractTextFromHTML(html) {
            if (!html) return '';
            const div = document.createElement('div');
            div.innerHTML = html;
            const text = div.textContent || div.innerText || '';
            return text.trim().substring(0, 150) + (text.length > 150 ? '...' : '');
        }

        // Pagination & Search State
        let allPosts = [];
        let filteredPosts = [];
        let currentPage = 1;
        const POSTS_PER_PAGE = 6;

        async function loadNews() {
            try {
                // Get guides: either has tag "hướng dẫn" OR category "Hướng dẫn"
                const { data, error } = await supabase
                    .from('featured_news')
                    .select('*')
                    .eq('status', 'published')
                    .or('tags.cs.{"hướng dẫn"},category.eq.huong-dan')
                    .order('published_at', { ascending: false });

                document.getElementById('loading').classList.add('hidden');

                if (error) throw error;

                if (!data || data.length === 0) {
                    document.getElementById('empty-state').classList.remove('hidden');
                    return;
                }

                allPosts = data;
                filteredPosts = data;
                renderPage(1);
            } catch (err) {
                console.error('Error loading guides:', err);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('empty-state').classList.remove('hidden');
            }
        }

        function renderPage(page) {
            currentPage = page;
            const start = (page - 1) * POSTS_PER_PAGE;
            const end = start + POSTS_PER_PAGE;
            const pagePosts = filteredPosts.slice(start, end);

            const grid = document.getElementById('news-grid');
            grid.classList.remove('hidden');

            if (pagePosts.length === 0) {
                grid.innerHTML = '<div class="col-span-2 text-center py-20"><p class="text-gray-500">Không tìm thấy hướng dẫn phù hợp.</p></div>';
                document.getElementById('pagination').classList.add('hidden');
                return;
            }

            grid.innerHTML = pagePosts.map(news => `
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden group hover:shadow-lg transition-shadow cursor-pointer flex flex-col"
                    onclick="window.location.href='news-detail.html?slug=${news.slug}'">
                    <div class="aspect-video overflow-hidden bg-gray-100 relative">
                        <img src="${news.thumbnail_url || 'logo.png'}" alt="${news.title}" class="w-full h-full object-cover">
                        <div class="absolute top-4 left-4">
                            <span class="bg-blue-500/90 backdrop-blur text-xs font-bold px-3 py-1 rounded-full shadow-sm text-white uppercase tracking-wider">
                                <i data-lucide="book-open" class="w-3 h-3 inline"></i> Hướng dẫn
                            </span>
                        </div>
                    </div>
                    <div class="p-6 flex-1 flex flex-col">
                        <div class="flex items-center gap-3 text-xs text-gray-500 mb-2">
                            <span class="flex items-center gap-1"><i data-lucide="calendar" class="w-3 h-3"></i> ${new Date(news.published_at || news.created_at).toLocaleDateString('vi-VN')}</span>
                        </div>
                        <h3 class="font-bold text-lg text-gray-900 mb-3 line-clamp-2 group-hover:text-red-600 transition-colors">${news.title}</h3>
                        <p class="text-gray-500 text-sm line-clamp-3 mb-4 flex-1">${news.summary || extractTextFromHTML(news.content_html) || 'Đang cập nhật nội dung...'}</p>
                        
                        <div class="pt-4 border-t border-gray-50 flex items-center justify-between">
                            <span class="text-red-600 text-sm font-semibold group-hover:translate-x-1 transition-transform inline-flex items-center gap-1">
                                Xem chi tiết <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </span>
                        </div>
                    </div>
                </div>
            `).join('');

            lucide.createIcons();
            renderPagination();
        }

        function renderPagination() {
            const totalPages = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);

            if (totalPages <= 1) {
                document.getElementById('pagination').classList.add('hidden');
                return;
            }

            document.getElementById('pagination').classList.remove('hidden');
            const paginationEl = document.getElementById('pagination');

            let buttons = [];

            // Previous button
            buttons.push(`
                <button onclick="changePage(${currentPage - 1})" 
                    ${currentPage === 1 ? 'disabled' : ''}
                    class="px-4 py-2 rounded-lg border ${currentPage === 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 hover:bg-gray-50'} transition-colors">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
            `);

            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === 1 || i === totalPages || (i >= currentPage - 1 && i <= currentPage + 1)) {
                    buttons.push(`
                        <button onclick="changePage(${i})"
                            class="px-4 py-2 rounded-lg border ${i === currentPage ? 'bg-red-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-50'} transition-colors font-medium">
                            ${i}
                        </button>
                    `);
                } else if (i === currentPage - 2 || i === currentPage + 2) {
                    buttons.push('<span class="px-2 text-gray-400">...</span>');
                }
            }

            // Next button
            buttons.push(`
                <button onclick="changePage(${currentPage + 1})" 
                    ${currentPage === totalPages ? 'disabled' : ''}
                    class="px-4 py-2 rounded-lg border ${currentPage === totalPages ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 hover:bg-gray-50'} transition-colors">
                    <i data-lucide="chevron-right" class="w-4 h-4"></i>
                </button>
            `);

            paginationEl.innerHTML = buttons.join('');
            lucide.createIcons();
        }

        function changePage(page) {
            const totalPages = Math.ceil(filteredPosts.length / POSTS_PER_PAGE);
            if (page < 1 || page > totalPages) return;
            renderPage(page);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function handleSearch(e) {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                filteredPosts = allPosts;
            } else {
                filteredPosts = allPosts.filter(post => {
                    // Search in title
                    if (post.title.toLowerCase().includes(query)) return true;
                    // Search in summary
                    if (post.summary && post.summary.toLowerCase().includes(query)) return true;
                    // ✅ Search in keyword aliases (NEW)
                    if (post.keyword_aliases && Array.isArray(post.keyword_aliases)) {
                        return post.keyword_aliases.some(alias =>
                            alias.toLowerCase().includes(query)
                        );
                    }
                    return false;
                });
            }
            renderPage(1);
        }

        // Search input event listener
        document.getElementById('searchInput').addEventListener('input', handleSearch);

        loadNews();
    </script>
</body>

</html>
