<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin - Đông Mai Số</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <!-- Supabase Client (Load Early) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <script>
        // Initialize Supabase
        window.supabase = window.supabaseClient || supabase.createClient(
            window.SUPABASE_CONFIG.url,
            window.SUPABASE_CONFIG.key
        );
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a365d 0%, #c41e3a 50%, #dc2626 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .input-field {
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #D32F2F;
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
        }

        .btn-login {
            background: linear-gradient(135deg, #D32F2F 0%, #B71C1C 100%);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(211, 47, 47, 0.3);
        }

        .password-toggle {
            cursor: pointer;
        }

        .password-toggle:hover {
            color: #D32F2F;
        }
    </style>
</head>

<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-2xl shadow-xl mb-4">
                <img src="../logo.png" alt="Logo" class="w-16 h-16 object-contain">
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Admin Portal</h1>
            <p class="text-white/80">Hệ thống quản trị Phường Đông Mai</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Đăng nhập</h2>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- Email -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <div class="relative">
                        <i data-lucide="mail"
                            class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                        <input type="email" id="email" placeholder="Nhập email của bạn"
                            class="input-field w-full pl-12 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none text-gray-900"
                            required>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Mật khẩu</label>
                    <div class="relative">
                        <i data-lucide="lock"
                            class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                        <input type="password" id="password" placeholder="Nhập mật khẩu"
                            class="input-field w-full pl-12 pr-12 py-3 border-2 border-gray-200 rounded-xl focus:outline-none text-gray-900"
                            required>
                        <button type="button" onclick="togglePassword()"
                            class="password-toggle absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember me -->
                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center">
                        <input type="checkbox" id="remember"
                            class="w-4 h-4 text-red-primary border-gray-300 rounded focus:ring-red-primary">
                        <span class="ml-2 text-sm text-gray-600">Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="#" class="text-sm text-red-primary hover:underline">Quên mật khẩu?</a>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden mb-4 p-4 bg-red-50 border border-red-200 rounded-xl">
                    <div class="flex items-center gap-2">
                        <i data-lucide="alert-circle" class="text-red-500 w-5 h-5"></i>
                        <p id="errorText" class="text-sm text-red-600"></p>
                    </div>
                </div>

                <!-- Login Button -->
                <button type="submit" id="loginBtn"
                    class="btn-login w-full py-3 rounded-xl text-white font-bold text-lg flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                    Đăng nhập
                </button>
            </form>

            <!-- Footer -->
            <div class="mt-6 text-center">
                <a href="/" class="inline-flex items-center gap-2 text-gray-600 hover:text-red-600 transition-colors">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    Quay lại trang chủ
                </a>
            </div>
        </div>


    </div>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // Initialize icons
        lucide.createIcons();

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // Initialize Supabase
        window.supabase = window.supabaseClient || supabase.createClient(
            window.SUPABASE_CONFIG.url,
            window.SUPABASE_CONFIG.key
        );

        // Check if already logged in
        async function checkAuth() {
            const adminUser = localStorage.getItem('adminUser');
            if (adminUser) {
                window.location.href = '/admin/';
            }
        }

        checkAuth();

        // Log admin activity (non-blocking)
        async function logAdminActivity(adminId, action, entityType, entityId, details) {
            try {
                await supabase.from('admin_activity_logs').insert({
                    admin_id: adminId,
                    action: action,
                    entity_type: entityType,
                    entity_id: entityId,
                    details: details,
                    ip_address: 'unknown',
                    user_agent: navigator.userAgent
                });
            } catch (e) {
                console.error('Failed to log activity:', e);
            }
        }

        // Handle login
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');

            // Show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> Đang đăng nhập...';
            lucide.createIcons();
            errorDiv.classList.add('hidden');

            try {
                // Timeout function
                const timeout = (ms) => new Promise((_, reject) => setTimeout(() => reject(new Error('Kết nối server quá lâu (Timeout)')), ms));

                // 1. Sign In
                const loginPromise = supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                const { data, error } = await Promise.race([loginPromise, timeout(10000)]);

                if (error) throw error;
                if (!data || !data.user) throw new Error('Đăng nhập thất bại');

                // 2. Check Role (with separate timeout)
                const rolePromise = supabase
                    .from('admin_users')
                    .select('*')
                    .eq('email', email)
                    .single();

                const { data: adminUser, error: adminError } = await Promise.race([rolePromise, timeout(8000)]);

                if (adminError || !adminUser) {
                    console.error('Role check error:', adminError);
                    throw new Error('Không thể xác minh quyền Admin. Vui lòng thử lại hoặc liên hệ quản trị viên.');
                }

                if (!adminUser.is_active) {
                    throw new Error('Tài khoản đã bị khóa.');
                }

                // Store session
                localStorage.setItem('adminUser', JSON.stringify(adminUser));
                localStorage.setItem('supabaseSession', JSON.stringify(data.session));

                // 3. Log Activity (Non-blocking)
                logAdminActivity(adminUser.id, 'login', 'auth', null, {
                    timestamp: new Date().toISOString()
                }).catch(console.error);

                // Redirect
                window.location.href = '/admin/';

            } catch (error) {
                console.error('Login error:', error);
                errorDiv.classList.remove('hidden');
                document.getElementById('errorText').textContent = error.message;

                // Reset button
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i data-lucide="log-in" class="w-5 h-5"></i> Đăng nhập';
                lucide.createIcons();

                // Clear any partial session
                localStorage.removeItem('adminUser');
                localStorage.removeItem('supabaseSession');
                await supabase.auth.signOut();
            }
        }
    </script>
</body>

</html>
