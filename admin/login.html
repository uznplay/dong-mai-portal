<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Admin - Đông Mai Số</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a365d 0%, #c41e3a 50%, #dc2626 100%);
            min-height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .input-field {
            transition: all 0.3s ease;
        }

        .input-field:focus {
            border-color: #D32F2F;
            box-shadow: 0 0 0 3px rgba(211, 47, 47, 0.1);
        }

        .btn-login {
            background: linear-gradient(135deg, #D32F2F 0%, #B71C1C 100%);
            transition: all 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(211, 47, 47, 0.3);
        }

        .password-toggle {
            cursor: pointer;
        }

        .password-toggle:hover {
            color: #D32F2F;
        }
    </style>
</head>

<body class="flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <!-- Logo & Title -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-20 h-20 bg-white rounded-2xl shadow-xl mb-4">
                <img src="../logo.png" alt="Logo" class="w-16 h-16 object-contain">
            </div>
            <h1 class="text-3xl font-bold text-white mb-2">Admin Portal</h1>
            <p class="text-white/80">Hệ thống quản trị Phường Đông Mai</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-3xl p-8 shadow-2xl">
            <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Đăng nhập</h2>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <!-- Email -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <div class="relative">
                        <i data-lucide="mail"
                            class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                        <input type="email" id="email" placeholder="Nhập email của bạn"
                            class="input-field w-full pl-12 pr-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none text-gray-900"
                            required>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-5">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Mật khẩu</label>
                    <div class="relative">
                        <i data-lucide="lock"
                            class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 w-5 h-5"></i>
                        <input type="password" id="password" placeholder="Nhập mật khẩu"
                            class="input-field w-full pl-12 pr-12 py-3 border-2 border-gray-200 rounded-xl focus:outline-none text-gray-900"
                            required>
                        <button type="button" onclick="togglePassword()"
                            class="password-toggle absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                            <i data-lucide="eye" id="eyeIcon" class="w-5 h-5"></i>
                        </button>
                    </div>
                </div>

                <!-- Remember me -->
                <div class="flex items-center justify-between mb-6">
                    <label class="flex items-center">
                        <input type="checkbox" id="remember"
                            class="w-4 h-4 text-red-primary border-gray-300 rounded focus:ring-red-primary">
                        <span class="ml-2 text-sm text-gray-600">Ghi nhớ đăng nhập</span>
                    </label>
                    <a href="#" class="text-sm text-red-primary hover:underline">Quên mật khẩu?</a>
                </div>

                <!-- Error Message -->
                <div id="errorMessage" class="hidden mb-4 p-4 bg-red-50 border border-red-200 rounded-xl">
                    <div class="flex items-center gap-2">
                        <i data-lucide="alert-circle" class="text-red-500 w-5 h-5"></i>
                        <p id="errorText" class="text-sm text-red-600"></p>
                    </div>
                </div>

                <!-- Login Button -->
                <button type="submit" id="loginBtn"
                    class="btn-login w-full py-3 rounded-xl text-white font-bold text-lg flex items-center justify-center gap-2">
                    <i data-lucide="log-in" class="w-5 h-5"></i>
                    Đăng nhập
                </button>
            </form>

            <!-- Footer -->
            <div class="mt-6 text-center">
                <a href="../index.html"
                    class="inline-flex items-center gap-2 text-white/80 hover:text-white transition-colors">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    Quay lại trang chủ
                </a>
            </div>
        </div>

        <!-- Demo Credentials -->
        <div class="mt-6 glass-card rounded-xl p-4 text-center">
            <p class="text-white/80 text-sm mb-2">Tài khoản demo:</p>
            <p class="text-white text-sm">Email: <code
                    class="bg-white/20 px-2 py-0.5 rounded">admin@dongmai.gov.vn</code></p>
            <p class="text-white text-sm">Mật khẩu: <code class="bg-white/20 px-2 py-0.5 rounded">admin123</code></p>
        </div>
    </div>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        // Initialize icons
        lucide.createIcons();

        // Toggle password visibility
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                passwordInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // Handle login
        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');
            const errorDiv = document.getElementById('errorMessage');

            // Show loading
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i data-lucide="loader" class="w-5 h-5 animate-spin"></i> Đang đăng nhập...';
            lucide.createIcons();
            errorDiv.classList.add('hidden');

            try {
                // Call Supabase auth
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw new Error(error.message);
                }

                // Get user role from admin_users table
                const { data: adminUser, error: adminError } = await supabase
                    .from('admin_users')
                    .select('*')
                    .eq('email', email)
                    .single();

                if (adminError || !adminUser) {
                    throw new Error('Tài khoản không có quyền truy cập admin');
                }

                if (!adminUser.is_active) {
                    throw new Error('Tài khoản đã bị khóa. Vui lòng liên hệ quản trị viên.');
                }

                // Store session
                localStorage.setItem('adminUser', JSON.stringify(adminUser));
                localStorage.setItem('supabaseSession', JSON.stringify(data.session));

                // Log activity
                await logAdminActivity(adminUser.id, 'login', 'auth', null, {
                    timestamp: new Date().toISOString()
                });

                // Redirect to dashboard
                window.location.href = 'admin-dashboard.html';

            } catch (error) {
                errorDiv.classList.remove('hidden');
                document.getElementById('errorText').textContent = error.message;
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i data-lucide="log-in" class="w-5 h-5"></i> Đăng nhập';
                lucide.createIcons();
            }
        }

        // Log admin activity
        async function logAdminActivity(adminId, action, entityType, entityId, details) {
            // Logging disabled
            return;
        }
        try {
            await supabase.from('admin_activity_logs').insert({
                admin_id: adminId,
                action: action,
                entity_type: entityType,
                entity_id: entityId,
                details: details,
                ip_address: await getClientIP(),
                user_agent: navigator.userAgent
            });
        } catch (e) {
            console.error('Failed to log activity:', e);
        }
        }

        // Get client IP (placeholder)
        async function getClientIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                return data.ip;
            } catch {
                return 'unknown';
            }
        }

        // Check if already logged in
        async function checkAuth() {
            const adminUser = localStorage.getItem('adminUser');
            if (adminUser) {
                window.location.href = 'admin-dashboard.html';
            }
        }

        checkAuth();
    </script>

    <!-- Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../config.js"></script>
    <script>
        // Initialize Supabase
        window.supabase = window.supabaseClient || supabase.createClient(
            window.SUPABASE_CONFIG.url,
            window.SUPABASE_CONFIG.key
        );
    </script>
</body>

</html>
