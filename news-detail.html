<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chi tiết tin tức - Đông Mai Số</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }

        .prose img {
            border-radius: 0.75rem;
            margin: 1.5rem 0;
            width: 100%;
        }

        .prose h1 {
            font-size: 2em;
            font-weight: 700;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }

        .prose h2 {
            font-size: 1.5em;
            font-weight: 600;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
        }

        .prose p {
            margin-bottom: 1em;
            line-height: 1.7;
            color: #374151;
        }

        .prose ul {
            list-style-type: disc;
            padding-left: 1.5em;
            margin-bottom: 1em;
        }

        .prose blockquote {
            border-left: 4px solid #ef4444;
            padding-left: 1rem;
            color: #4b5563;
            font-style: italic;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
    <!-- Header -->
    <header class="fixed top-0 left-0 right-0 z-50 bg-white/95 backdrop-blur-sm shadow-sm border-b border-gray-100">
        <div class="container mx-auto px-4 h-16 flex justify-between items-center">
            <a href="index.html" class="flex items-center gap-3 group">
                <div
                    class="w-14 h-14 bg-white rounded-xl flex items-center justify-center shadow-lg group-hover:scale-105 transition-transform border border-gray-100">
                    <img src="logo.png" alt="Logo" class="w-12 h-12 object-contain">
                </div>
                <div class="flex flex-col">
                    <span
                        class="font-bold text-xl text-gray-900 group-hover:text-red-600 transition-colors uppercase">ĐÔNG
                        MAI
                        SỐ</span>
                    <span class="text-[10px] text-gray-500 uppercase tracking-widest">Hành chính phục vụ</span>
                </div>
            </a>
            <a href="tin-noi-bat.html"
                class="text-sm font-medium text-gray-600 hover:text-red-600 flex items-center gap-1">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Trở về danh sách
            </a>
        </div>
    </header>

    <main class="pt-24 pb-20 px-4 flex-1">
        <div class="container mx-auto max-w-6xl">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

                <!-- Main Content (Left) -->
                <article class="lg:col-span-2">
                    <!-- Loading -->
                    <div id="loading" class="text-center py-20">
                        <i data-lucide="loader" class="w-10 h-10 text-red-600 animate-spin mx-auto mb-4"></i>
                        <p class="text-gray-500">Đang tải...</p>
                    </div>

                    <div id="content"
                        class="hidden bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                        <div class="p-6 md:p-8">
                            <!-- Breadcrumb -->
                            <div class="flex items-center gap-2 text-sm text-gray-500 mb-6">
                                <a href="index.html" class="hover:text-red-600">Trang chủ</a>
                                <span>/</span>
                                <a href="tin-noi-bat.html" class="hover:text-red-600">Tin tức</a>
                                <span>/</span>
                                <span id="categoryLabel" class="text-gray-900 font-medium">Chi tiết</span>
                            </div>

                            <h1 id="title"
                                class="text-2xl md:text-3xl lg:text-4xl font-bold text-gray-900 mb-4 leading-tight">
                            </h1>

                            <div
                                class="flex items-center gap-4 text-sm text-gray-500 mb-6 pb-6 border-b border-gray-100">
                                <span class="flex items-center gap-1">
                                    <i data-lucide="calendar" class="w-4 h-4"></i>
                                    <span id="date"></span>
                                </span>
                            </div>

                            <div id="summary"
                                class="text-lg font-medium text-gray-700 italic mb-8 bg-gray-50 p-4 rounded-xl border-l-4 border-red-500"
                                style="display: none;">
                            </div>

                            <!-- Body Content -->
                            <div id="body" class="prose prose-lg max-w-none text-gray-800"></div>

                            <div id="tagsContainer" class="mt-8 pt-6 border-t border-gray-100" style="display: none;">
                                <span class="text-sm font-bold text-gray-900 mr-2">Tags:</span>
                                <div id="tags" class="inline-flex flex-wrap gap-2"></div>
                            </div>
                        </div>
                    </div>
                </article>

                <!-- Sidebar (Right) -->
                <aside class="space-y-6">
                    <!-- Tin nổi bật / Xem nhiều -->
                    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sticky top-24">
                        <h3
                            class="font-bold text-lg text-gray-900 mb-4 flex items-center gap-2 border-b border-gray-100 pb-2">
                            <span class="w-1 h-6 bg-red-600 rounded-full"></span>
                            Tin Mới Nhất
                        </h3>
                        <div id="popularNews" class="space-y-4">
                            <!-- Injected by JS -->
                            <div class="animate-pulse space-y-3">
                                <div class="h-20 bg-gray-100 rounded-lg"></div>
                                <div class="h-20 bg-gray-100 rounded-lg"></div>
                                <div class="h-20 bg-gray-100 rounded-lg"></div>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>
        </div>
    </main>

    <footer class="bg-gray-900 text-white py-8 mt-12">
        <div class="container mx-auto px-4 text-center">
            <p>&copy; 2026 UBND Phường Đông Mai. All rights reserved.</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        lucide.createIcons();
        window.supabase = window.supabaseClient || supabase.createClient(window.SUPABASE_CONFIG.url, window.SUPABASE_CONFIG.key);

        async function initPage() {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const id = params.get('id');

            if (!slug && !id) {
                window.location.href = 'tin-noi-bat.html';
                return;
            }

            try {
                let query = supabase.from('featured_news').select('*').eq('status', 'published');
                if (slug) query = query.eq('slug', slug);
                else query = query.eq('id', id);

                const { data: post, error } = await query.single();
                if (error || !post) throw error;

                // Render Main Post
                renderPost(post);

                // View count removed per user request

                // Load Popular News (Sidebar)
                loadPopularNews(post.id);

            } catch (err) {
                console.error(err);
                document.getElementById('loading').innerHTML = '<p class="text-red-500">Không tìm thấy bài viết</p>';
            }
        }

        function renderPost(post) {
            document.title = `${post.title} - Đông Mai Số`;
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');

            document.getElementById('title').textContent = post.title;

            // Show summary only if exists
            const summaryEl = document.getElementById('summary');
            if (post.summary && post.summary.trim()) {
                summaryEl.textContent = post.summary;
                summaryEl.style.display = 'block';
            } else {
                summaryEl.style.display = 'none';
            }

            document.getElementById('body').innerHTML = post.content_html || 'Nội dung đang cập nhật...';
            document.getElementById('date').textContent = new Date(post.published_at || post.created_at).toLocaleDateString('vi-VN');

            const catMap = { 'tin-tuc': 'Tin tức', 'su-kien': 'Sự kiện', 'thong-bao': 'Thông báo' };
            document.getElementById('categoryLabel').textContent = catMap[post.category] || 'Tin tức';

            // Show tags only if exist
            const tagsContainer = document.getElementById('tagsContainer');
            if (post.tags && post.tags.length) {
                document.getElementById('tags').innerHTML = post.tags.map(t => `<span class="px-2 py-1 bg-gray-100 text-gray-600 text-xs rounded hover:bg-gray-200">#${t}</span>`).join('');
                tagsContainer.style.display = 'block';
            } else {
                tagsContainer.style.display = 'none';
            }
        }

        async function loadPopularNews(currentId) {
            const { data, error } = await supabase.from('featured_news')
                .select('slug, title, thumbnail_url, published_at')
                .eq('status', 'published')
                .neq('id', currentId)
                .order('published_at', { ascending: false })
                .limit(5);

            const container = document.getElementById('popularNews');
            if (error) {
                console.error("Error loading popular news:", error);
                container.innerHTML = '<p class="text-sm text-gray-500">Không thể tải tin khác.</p>';
                return;
            }

            if (data && data.length) {
                container.innerHTML = data.map(news => `
                    <div class="flex gap-3 p-3 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer group"
                        onclick="window.location.href='news-detail.html?id=${news.id}'">
                        <div class="w-20 h-20 rounded-lg overflow-hidden bg-gray-100 flex-shrink-0">
                            <img src="${news.thumbnail_url || 'logo.png'}" class="w-full h-full object-cover group-hover:scale-105 transition-transform">
                        </div>
                        <div class="flex-1 min-w-0">
                            <h4 class="text-sm font-semibold text-gray-800 group-hover:text-red-600 line-clamp-2 mb-1">${news.title}</h4>
                            <div class="text-xs text-gray-500 flex items-center gap-2">
                                <span><i data-lucide="calendar" class="w-3 h-3 inline"></i> ${new Date(news.published_at).toLocaleDateString('vi-VN')}</span>
                            </div>
                        </div>
                    </a>
                `).join('');
                lucide.createIcons();
            } else {
                container.innerHTML = '<p class="text-sm text-gray-500">Chưa có tin khác.</p>';
            }
        }

        initPage();
    </script>
</body>

</html>
